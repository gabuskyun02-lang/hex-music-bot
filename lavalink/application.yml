server:
  port: "2333"
  address: "0.0.0.0"

lavalink:
  server:
    # Must match LAVALINK_PASSWORD in .env
    password: "youshallnotpass"
    sources:
      youtube: true
      soundcloud: true
      bandcamp: true
      twitch: true
      vimeo: true
      http: true
      local: false
  filters:
    volume: true
    equalizer: true
    karaoke: true
    timescale: true
    tremolo: true
    vibrato: true
    distortion: true
    rotation: true
    channelMix: true
    lowPass: true

logging:
  file:
    path: "./logs/"
  logback:
    rollingpolicy:
      max-file-size: "1GB"
      max-history: 30
  level:
    root: INFO
    lavalink: INFO

